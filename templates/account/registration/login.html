{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
        
        <p class="mt-3">New here? <a href="{% url 'account_signup' %}">Create your account here</a></p>
    </form>
    
</div>
{% endblock %}
